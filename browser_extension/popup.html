<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberSentinel Extension</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      width: 380px;
      min-height: 480px;
      padding: 14px;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3); display: flex; align-items: center; justify-content: center; font-size: 14px;">
        🛡️
      </div>
      <div>
        <div style="font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px;">
          <span>CYBER SENTINEL</span>
          <span class="badge badge-emerald">ACTIVE</span>
        </div>
        <div style="font-size: 10px; color: #94a3b8;">Live Browser Packet Defense</div>
      </div>
    </div>
    <button id="btn-open-dashboard" class="btn btn-outline" style="padding: 4px 8px; font-size: 10px;">
      <span>🖥️</span> Dashboard
    </button>
  </div>

  <!-- Quick Telemetry HUD -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
    <div class="hud-card" style="padding: 10px;">
      <div class="hud-title">Live Requests</div>
      <div id="stat-requests" class="hud-value" style="font-size: 18px; color: #fff;">0</div>
    </div>
    <div class="hud-card" style="padding: 10px;">
      <div class="hud-title">Threat Incidents</div>
      <div id="stat-threats" class="hud-value" style="font-size: 18px; color: #f43f5e;">0</div>
    </div>
  </div>

  <!-- Active Alerts & Quarantine Box -->
  <div style="margin-bottom: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
      <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #f43f5e; display: flex; align-items: center; gap: 4px;">
        <span>🚨</span> Security Interceptions
      </span>
      <button id="btn-clear-alerts" style="background: none; border: none; color: #64748b; font-size: 10px; cursor: pointer;">Clear</button>
    </div>
    <div id="alerts-container" style="display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto;">
      <div style="padding: 8px; background: rgba(9, 13, 24, 0.4); border: 1px solid #1e293b; border-radius: 6px; text-align: center; color: #64748b; font-size: 10px;">
        ✔ Clean: No security anomalies detected on active session.
      </div>
    </div>
  </div>

  <!-- Live Traffic Stream -->
  <div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
      <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #06b6d4;">
        📦 Recent Ingested Packets
      </span>
      <span id="quarantined-badge" style="font-size: 10px; color: #94a3b8; font-family: monospace;">0 blocked</span>
    </div>
    <div id="packets-container" style="display: flex; flex-direction: column; gap: 4px; max-height: 170px; overflow-y: auto; font-family: monospace; font-size: 10px;">
      <!-- Packets stream -->
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
